[package]
name = "parsec-web-encoding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Bytes into Parsec: the HTML Standard's encoding sniffing over the WHATWG Encoding Standard's encodings."
repository.workspace = true
license.workspace = true
readme = "../../README.md"
keywords = ["html", "encoding", "charset", "whatwg", "parser"]
categories = ["encoding", "parser-implementations", "web-programming"]
documentation = "https://docs.rs/parsec-web-encoding"

# The conformance suites run from the repository; their vendored data
# would be most of the package and nothing a build needs.
exclude = ["tests/"]

[lib]
name = "parsec_encoding"

[dependencies]
encoding_rs = "0.8.35"
parsec-web-core = { path = "../parsec", version = "0.3.0", optional = true }

[features]
default = ["parse"]
# parse_bytes and ByteParser: decoding into a parsec-web-core Document.
# Without it, sniff, prescan, Offsets and locale_default stand alone.
parse = ["dep:parsec-web-core"]

[dev-dependencies]
serde_json = "1"

[[test]]
name = "html5lib"
required-features = ["parse"]

[[test]]
name = "streaming"
required-features = ["parse"]

[[test]]
name = "wpt"
required-features = ["parse"]

[[test]]
name = "offsets"
required-features = ["parse"]
