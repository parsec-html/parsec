[package]
name = "parsec-html-encoding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Bytes into Parsec: the HTML Standard's encoding sniffing over the WHATWG Encoding Standard's encodings."
repository.workspace = true
license.workspace = true
readme = "../../README.md"
keywords = ["html", "encoding", "charset", "whatwg", "parser"]
categories = ["encoding", "parser-implementations", "web-programming"]
# As parsec-html: not until it's ahead of Lexbor.
publish = false

[lib]
name = "parsec_encoding"

[dependencies]
encoding_rs = "0.8.35"
parsec-html = { path = "../parsec" }

[dev-dependencies]
serde_json = "1"
