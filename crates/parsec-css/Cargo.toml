[package]
name = "parsec-html-css"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "CSS Syntax Level 3 for Parsec: tokenizer, parser, An+B and serialization, tested against css-parsing-tests."
repository.workspace = true
license.workspace = true
readme = "../../README.md"
keywords = ["css", "parser", "tokenizer", "stylesheet", "css-syntax"]
categories = ["parser-implementations", "web-programming"]
documentation = "https://docs.rs/parsec-html-css"

# The conformance suites run from the repository; their vendored data
# would be most of the package and nothing a build needs. Nor is data/,
# what scripts/ generates src/values/generated.rs from.
exclude = ["tests/", "data/"]

[lib]
name = "parsec_css"

[dependencies]
# The document the cascade styles, and its selector engine.
parsec-html-core = { path = "../parsec", version = "0.1.0" }
# For stylesheets given as bytes; already Parsec's, through parsec-html-encoding.
encoding_rs = "0.8.35"

[dev-dependencies]
serde_json = "1"
