[package]
name = "parsec-xpath"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
# The libxml2 cases run from the repository; a build needs none of them.
exclude = ["tests/"]
description = "XPath 1.0 over Parsec's HTML document tree."
keywords = ["xpath", "html", "parser", "dom"]
categories = ["parser-implementations", "web-programming"]
documentation = "https://docs.rs/parsec-xpath"

[lib]
name = "parsec_xpath"

[dependencies]
parsec-html-core = { path = "../parsec", version = "0.2.0" }
stacker = "0.1"
