[workspace]
resolver = "3"
members = ["crates/parsec", "crates/parsec-html", "crates/parsec-capi", "crates/parsec-css", "crates/parsec-encoding", "crates/parsec-url", "crates/parsec-xpath", "crates/parsec-base", "crates/parsec-js", "crates/parsec-xml"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/parsec-html/parsec"
rust-version = "1.88"

[profile.release]
lto = "thin"
codegen-units = 1
