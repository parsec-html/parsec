version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # html5lib-tests. The tree-construction tests are pinned files, not a
  # submodule, and move with crates/parsec/scripts/fetch-tree-tests.sh.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    # bench/lexbor and bench/libxml2 stay on release tags. Dependabot
    # follows the default branch, which doesn't contain the tags we pin, so
    # it moved Lexbor from v3.0.1 to a 3.0.0 commit (#74) and libxml2 from
    # v2.15.4 back to v2.15.0 (#243). A newer release of either is moved to
    # by hand.
    ignore:
      - dependency-name: bench/lexbor
      - dependency-name: bench/libxml2
