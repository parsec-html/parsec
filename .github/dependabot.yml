version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # html5lib-tests. The tree-construction tests are pinned files, not a
  # submodule, and move with crates/parsec/scripts/fetch-tree-tests.sh.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    # bench/lexbor stays on a release tag. Dependabot follows the default
    # branch, which doesn't contain the v3.0.1 tag, so it moved the bench to
    # a 3.0.0 commit (#74). A newer Lexbor release is moved to by hand.
    ignore:
      - dependency-name: bench/lexbor
