name: release

# A release starts with a signed tag pushed to a v* name. The tag's
# signature is checked first and the gates are passed (every conformance
# count at least the last release's, the final boss without a crash, a
# hang or a different tree, and five minutes of fuzzing on every target
# without a finding); then the crates are built twice and must come out
# the same, and only then are they attested, attached to a GitHub release
# and published to crates.io. A manual run does all but the tag check and
# the publishing, to try a release first.
#
# crates.io is trusted publishing, so no token is stored here. It stays off
# until each crate has this workflow as its trusted publisher, the
# `release` environment exists, and the repository variable
# CRATES_PUBLISH is true. release-python.yml, release-npm.yml and
# release-capi.yml wait for this workflow's GitHub release before they
# publish, so a tag that fails the check publishes nothing anywhere.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Against the signers on main, not the tagged commit's: someone who
      # can push a tag could also change the file it would be checked with.
      # The annotated tag is fetched again by name, so `git tag -v` sees
      # its signature, not a lightweight ref to the commit.
      - name: The tag is signed by a maintainer
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --quiet --force origin "refs/tags/$TAG:refs/tags/$TAG" refs/heads/main:refs/remotes/origin/main
          git show origin/main:.github/allowed_signers > "$RUNNER_TEMP/allowed_signers"
          git config gpg.ssh.allowedSignersFile "$RUNNER_TEMP/allowed_signers"
          git tag -v "$TAG"
      - name: The tag is the crates' version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          [ "v$version" = "$TAG" ] || { echo "Cargo.toml says $version, the tag $TAG" >&2; exit 1; }

  # The gates. Each conformance suite's counts against
  # conformance/baseline.json, the last release's, which changes only in
  # a release pull request: fewer passed or more failed in any suite, or a
  # suite that wrote no counts, fails the release.
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # The W3C XML suite isn't in the repository; xmlconf fails under CI
      # without it, as it should.
      - run: crates/parsec-xml/scripts/fetch-xmlconf.sh
      - run: cargo test --workspace --no-fail-fast
        env:
          CONFORMANCE_DIR: ${{ runner.temp }}/conformance
      - name: Every count is at least the last release's
        # pipefail, so the gate's status isn't tee's.
        shell: bash
        if: ${{ !cancelled() }}
        run: scripts/conformance-gate.sh conformance/baseline.json "$RUNNER_TEMP/conformance" | tee -a "$GITHUB_STEP_SUMMARY"

  # All 1,000 pages of the final boss through Parsec and html5ever: any
  # crash, page over 10 s, page without a document, or page where the two
  # build a different number of elements fails the release. Not timed;
  # speed is checked by hand (the Releasing page on the wiki).
  boss:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: cargo run --release --locked --manifest-path bench/Cargo.toml -- boss --gate

  # Every cargo-fuzz target in crates/*/fuzz, read from the manifests so a
  # new one is fuzzed without a change here.
  fuzz-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: |
          for m in crates/*/fuzz/Cargo.toml; do
            crate=$(basename "$(dirname "$(dirname "$m")")")
            cargo metadata --no-deps --format-version 1 --manifest-path "$m" |
              jq -c --arg crate "$crate" '.packages[].targets[] | select(.kind | index("bin")) | {crate: $crate, target: .name}'
          done | jq -sc '{include: .}' > "$RUNNER_TEMP/matrix"
          cat "$RUNNER_TEMP/matrix"
          jq -e '.include | length > 0' "$RUNNER_TEMP/matrix" > /dev/null
          echo "matrix=$(cat "$RUNNER_TEMP/matrix")" >> "$GITHUB_OUTPUT"

  # Five minutes on each, all at once, as the nightly run does
  # (fuzz.yml): anything it finds fails the release, and is kept.
  fuzz:
    needs: [fuzz-targets]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.fuzz-targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz for five minutes
        working-directory: crates/${{ matrix.crate }}
        env:
          TARGET: ${{ matrix.target }}
        run: cargo fuzz run "$TARGET" -- -max_total_time=300 -max_len=4096
      - name: Keep what it found
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.crate }}-${{ matrix.target }}
          path: crates/${{ matrix.crate }}/fuzz/artifacts

  # One job that passes only when every gate did, for the build to wait on.
  gates:
    needs: [conformance, boss, fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Every gate passed"

  build:
    needs: [tag, gates]
    # A manual run skips the tag check and builds what it's run on; no run
    # builds without the gates.
    if: ${{ !cancelled() && needs.gates.result == 'success' && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # Twice, from two checkouts, and the two must be the same byte for
      # byte; anyone can run the same script at the tag and compare.
      - name: Package the crates twice and compare
        run: scripts/package-twice.sh HEAD dist | tee dist.sha256
      - run: mv dist.sha256 dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crates
          path: dist

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # To create the release and attach the files.
      contents: write
      # To sign the build provenance.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crates
          path: dist
      # Signed provenance for each crate, checkable with
      # `gh attestation verify FILE --repo parsec-html/parsec`; the bundle is
      # attached to the release too (see SECURITY.md).
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.crate
      - run: cp "$BUNDLE" "dist/parsec-${GITHUB_REF_NAME}.intoto.jsonl"
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Parsec ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  crates-io:
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'parsec-html/parsec' && vars.CRATES_PUBLISH == 'true'
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: release
      url: https://crates.io/crates/parsec-html
    permissions:
      contents: read
      # For trusted publishing.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # The packages attested and attached to the release: what crates.io
      # ends up with is checked against them.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crates
          path: ${{ runner.temp }}/dist
      - id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      # In dependency order, each one after the crates it needs; cargo waits
      # for each to reach the index before the next resolves against it. A
      # version crates.io already has is skipped, so a failed run can be
      # run again, but only if it's the package built here.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          checksum() {
            json=$(curl -sf -A "parsec-html release (github.com/parsec-html/parsec)" \
              "https://crates.io/api/v1/crates/$1/$version") || return 1
            jq -er .version.checksum <<< "$json"
          }
          for crate in parsec-base parsec-xml parsec-js parsec-html-core parsec-html-encoding parsec-url parsec-xpath parsec-html-css parsec-html; do
            want=$(sha256sum "$RUNNER_TEMP/dist/$crate-$version.crate" | cut -d' ' -f1)
            if have=$(checksum "$crate"); then
              echo "$crate $version is on crates.io already"
            else
              cargo publish -p "$crate" --locked
              have=$(checksum "$crate")
            fi
            [ "$have" = "$want" ] || { echo "$crate $version on crates.io is $have, the release's is $want" >&2; exit 1; }
          done
