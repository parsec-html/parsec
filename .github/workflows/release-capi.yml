name: release-capi

# The C libraries for a release, beside the crate release.yml publishes:
# built on each platform, packaged with the header, pkg-config and CMake
# files, smoke-tested by building tests/capi.c against the package, then
# attested and attached to the release release.yml makes for the same tag.
# That release only appears once the tag's signature has been checked, so
# nothing is attested or attached for a tag that fails it. A pull request
# that touches the C API or this file, and a manual run, build and test
# every package without publishing, so a release finds no surprises.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "crates/parsec-capi/**"
      - ".github/workflows/release-capi.yml"
  workflow_dispatch:

concurrency:
  group: release-capi-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04's glibc (2.35), so the library loads on distributions a
          # few years old as well as new ones.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin, x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}
      - name: Package the C libraries
        id: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          name="parsec-capi-$version-$TARGET"
          crates/parsec-capi/package.sh "$RUNNER_TEMP/$name" "$TARGET"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Build and run tests/capi.c against the package
        shell: bash
        env:
          NAME: ${{ steps.package.outputs.name }}
        run: |
          cmake -S crates/parsec-capi/tests -B "$RUNNER_TEMP/capi-test" -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/$NAME" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/capi-test" --config Release
          ctest --test-dir "$RUNNER_TEMP/capi-test" -C Release --output-on-failure
      - name: Archive (tar.gz)
        if: runner.os != 'Windows'
        env:
          NAME: ${{ steps.package.outputs.name }}
        run: |
          mkdir dist
          tar -C "$RUNNER_TEMP" -czf "dist/$NAME.tar.gz" "$NAME"
      - name: Archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NAME: ${{ steps.package.outputs.name }}
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path "$env:RUNNER_TEMP/$env:NAME" -DestinationPath "dist/$env:NAME.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # To attach the files to the release.
      contents: write
      # To sign the build provenance.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: parsec-capi-*
          path: dist
          merge-multiple: true
      # release.yml makes the release once the tag's signature checks out
      # and the crate has built twice the same; wait for it rather than
      # make one here, so there's one place a release comes from.
      - name: Wait for release.yml's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 60); do
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && exit 0
            sleep 30
          done
          echo "no release for $GITHUB_REF_NAME after 30 minutes: did release.yml fail?" >&2
          exit 1
      - run: cd dist && sha256sum -- * > parsec-capi-SHA256SUMS
      # Signed provenance for each archive, checkable with
      # `gh attestation verify FILE --repo parsec-html/parsec`.
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - run: cp "$BUNDLE" "dist/parsec-capi-${GITHUB_REF_NAME}.intoto.jsonl"
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
      - run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
