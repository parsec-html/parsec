name: node

# bindings/node, the native build of the parsec-html npm package: built on
# each platform it ships for, then the package's tests run against it
# there, and against the WebAssembly build it falls back to. Each
# platform's package is uploaded as an artifact; release-npm.yml calls this
# workflow and publishes them.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: node-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo deny check licenses bans sources

  # The WebAssembly package the native builds go with: their tests run
  # through its loader, and the fallback runs it.
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: bindings/wasm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: wasm-pack
      - run: ./build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-for-node
          path: bindings/wasm/pkg
          if-no-files-found: error

  native:
    needs: [wasm]
    name: native (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64-gnu, os: ubuntu-24.04, lib: libparsec_html_node.so }
          - { platform: linux-arm64-gnu, os: ubuntu-24.04-arm, lib: libparsec_html_node.so }
          - { platform: linux-x64-musl, os: ubuntu-24.04, lib: libparsec_html_node.so, alpine: true }
          - { platform: linux-arm64-musl, os: ubuntu-24.04-arm, lib: libparsec_html_node.so, alpine: true }
          - { platform: darwin-x64, os: macos-15-intel, lib: libparsec_html_node.dylib }
          - { platform: darwin-arm64, os: macos-15, lib: libparsec_html_node.dylib }
          - { platform: win32-x64-msvc, os: windows-2025, lib: parsec_html_node.dll }
          - { platform: win32-arm64-msvc, os: windows-11-arm, lib: parsec_html_node.dll }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        if: ${{ !matrix.alpine }}
        with:
          toolchain: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Build
        if: ${{ !matrix.alpine }}
        run: cargo build --release --locked --manifest-path bindings/node/Cargo.toml
      # musl's Node, Rust and C library are Alpine's, so the build is in
      # Alpine. Rust links musl statically unless told not to, and a
      # Node-API addon has to share Node's.
      - name: Build in Alpine
        if: ${{ matrix.alpine }}
        run: |
          docker run --rm -v "$PWD:/w" -w /w -e CARGO_TERM_COLOR \
            -e RUSTFLAGS="-C target-feature=-crt-static" "$ALPINE" \
            sh -c 'apk add --no-cache musl-dev && cargo build --release --locked --manifest-path bindings/node/Cargo.toml'
      - name: The platform's package
        run: node bindings/node/npm.mjs platform ${{ matrix.platform }} bindings/node/target/release/${{ matrix.lib }} npm-native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-${{ matrix.platform }}
          path: npm-native/${{ matrix.platform }}
          if-no-files-found: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-for-node
          path: bindings/wasm/pkg
      # As `npm install` places them, without npm; copies, as Windows
      # makes symbolic links only for administrators.
      - name: Install them side by side
        working-directory: bindings/wasm
        run: |
          mkdir -p node_modules/@parsec-web
          cp -R pkg node_modules/parsec-html
          cp -R ../../npm-native/${{ matrix.platform }} "node_modules/$(node -p 'require("./npm/package.json").napi.packageName')-${{ matrix.platform }}"
      - name: Test
        if: ${{ !matrix.alpine }}
        working-directory: bindings/wasm
        run: |
          node -e 'if (require("parsec-html").backend !== "native") process.exit(1)'
          PARSEC_BACKEND=native node --test tests/package.test.mjs
          PARSEC_BACKEND=wasm node --test tests/package.test.mjs
      - name: Test in Alpine
        if: ${{ matrix.alpine }}
        run: |
          docker run --rm -v "$PWD:/w" -w /w/bindings/wasm "$ALPINE" sh -c '
            apk add --no-cache nodejs &&
            node -e "if (require(\"parsec-html\").backend !== \"native\") process.exit(1)" &&
            PARSEC_BACKEND=native node --test tests/package.test.mjs &&
            PARSEC_BACKEND=wasm node --test tests/package.test.mjs'
    env:
      # rust:1.99.1-alpine3.24
      ALPINE: rust@sha256:44819b27be4c97b0e4d7203bd2e02c4820f97700211b6a37fb4c246a2de59383
