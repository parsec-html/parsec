name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue's run, on the pull request merged onto the latest main.
  merge_group:
  workflow_dispatch:

# A new push to a pull request ends the run on its old commit. Runs on
# main all finish: each one tests a commit that landed.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # XPath without the HTML parser, as a crate with its own tree uses it.
      - run: cargo clippy -p parsec-xpath --no-default-features --all-targets -- -D warnings
      - run: cargo test -p parsec-xpath --no-default-features
      # A crate at a time: three of them name their library `parsec`, which
      # one `cargo doc --workspace` can't write side by side.
      - name: The API docs build without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          for p in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name'); do
            cargo doc --no-deps -p "$p" || exit 1
          done
      # The fuzz crates sit outside the workspace and build only in the
      # nightly fuzz run, so a manifest that cargo can't load fails there.
      - run: for m in crates/*/fuzz/Cargo.toml; do cargo metadata --no-deps --format-version 1 --manifest-path "$m" > /dev/null || exit 1; done
      - run: scripts/conformance-gate.test.sh
      # A prebuilt binary: the cargo-deny action builds a Docker image on
      # every run, and fails whenever Docker Hub does.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny
      - run: cargo deny check licenses bans sources

  # The benchmark against Lexbor is its own workspace, so the test job on
  # three OSes doesn't build Lexbor's C. Here it's linted, built, and run on
  # pages it makes itself; the real pages aren't in the repository.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt --manifest-path bench/Cargo.toml --check
      - run: cargo clippy --manifest-path bench/Cargo.toml --release -- -D warnings
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny
      - run: cargo deny --manifest-path bench/Cargo.toml check licenses bans sources
      - run: cargo run --release --manifest-path bench/Cargo.toml -- "shop 1 MB" "unclosed tables"
      # The final boss, small: 300 seeded pages of broken fragments,
      # encoding quirks and 2 MB giants, as bytes, Parsec only. Not timed
      # against anything; it fails on a crash, a page over 10 s, or a page
      # without a document.
      - run: cargo run --release --manifest-path bench/Cargo.toml -- boss --smoke

  # Known vulnerabilities in the Rust dependencies, from the RustSec
  # database. Not a required check: a new advisory shouldn't block an
  # unrelated pull request, but it shows red until it's fixed.
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny
      - run: cargo deny check advisories

  # crates/parsec's source comes from Netweir's crates/netweir-html. This
  # fails if it no longer matches Netweir at the commit in NETWEIR_COMMIT,
  # which is what an edit made here instead of there looks like.
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A pull request can change NETWEIR_COMMIT, so only a full commit
      # hash is used: never a branch, tag or anything else git would read.
      - id: pin
        run: |
          commit=$(tr -d '[:space:]' < NETWEIR_COMMIT)
          if ! printf '%s' "$commit" | grep -Eqx '[0-9a-f]{40}'; then
            echo "NETWEIR_COMMIT must hold a full 40-character commit hash, not '$commit'" >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: netweir/netweir
          ref: ${{ steps.pin.outputs.commit }}
          path: netweir
          persist-credentials: false
      # The sync formats each copied Rust file with rustfmt, so the check
      # needs the same rustfmt as the lint job.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: scripts/sync-from-netweir.sh --check netweir
      - name: Every Rust file states its licence and copyright
        run: scripts/check-headers.sh

  # A release is the crates cargo packages, and they have to come out the
  # same every time (release.yml). The script builds them twice from fresh
  # checkouts; the packages from this checkout, which has the submodules,
  # must match them too, as they would for anyone rebuilding a release.
  # Packaging them here also builds each package on its own against the
  # others, as crates.io will have them, as `cargo publish` would.
  reproducible:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: The crates package the same twice, and with submodules
        run: |
          scripts/package-twice.sh HEAD > "$RUNNER_TEMP/twice"
          cargo package --quiet --workspace --exclude parsec-capi --exclude parsec-reduce --locked
          (cd target/package && sha256sum -- *.crate) > "$RUNNER_TEMP/here"
          cat "$RUNNER_TEMP/twice"
          diff "$RUNNER_TEMP/twice" "$RUNNER_TEMP/here"
      # The conformance data runs from the repository; in a package it's
      # only weight for everyone who builds it.
      - name: No crate ships test data
        run: |
          for p in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name'); do
            [ "$p" = parsec-capi ] && continue
            if cargo package --list --locked -p "$p" | grep -E '^(tests|data)/'; then
              echo "$p's package holds the files above" >&2
              exit 1
            fi
          done
      # crates.io shows README.md as each crate's page, where a link
      # relative to the repository goes nowhere.
      - name: README.md's links are absolute
        run: |
          if grep -nE '\]\([^h#)]|src="[^h]' README.md; then
            echo "use https:// links in README.md: crates.io can't follow relative ones" >&2
            exit 1
          fi

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # The conformance runners write each suite's counts to
      # $CONFORMANCE_DIR/<suite>.json; Linux's go up as an artifact and into
      # the run's summary, even when a suite fails. (conformance/ in the
      # repository holds the baseline they're held to.)
      - run: cargo test --workspace
        env:
          CONFORMANCE_DIR: ${{ github.workspace }}/target/conformance
      - name: Conformance summary
        if: always() && runner.os == 'Linux'
        run: |
          {
            echo "| Suite | Passed | Failed | Skipped | Test data |"
            echo "|---|---:|---:|---:|---|"
            for f in target/conformance/*.json; do
              jq -r '"| \(.suite) | \(.passed) | \(.failed) | \(.skipped) (\(.skipped_because)) | `\(.test_data_commit[0:12])` |"' "$f"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && runner.os == 'Linux'
        with:
          name: conformance
          path: target/conformance/
          if-no-files-found: error

  # The test job's counts against conformance/baseline.json, as the
  # release's gate holds them (release.yml), so a drop shows on the pull
  # request that made it rather than on release day. For information: it
  # isn't a required check, as a pull request may mean to trade a case,
  # and the baseline changes only in a release pull request.
  conformance:
    needs: [test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conformance
          path: ${{ runner.temp }}/conformance
      - name: Every count is at least the last release's
        # pipefail, so the gate's status isn't tee's.
        shell: bash
        run: scripts/conformance-gate.sh conformance/baseline.json "$RUNNER_TEMP/conformance" | tee -a "$GITHUB_STEP_SUMMARY"

  # The C API on each OS: crates/parsec-capi/package.sh builds the package a
  # release ships (macOS as one universal library, as released), and
  # tests/capi.c is built against it through find_package(parsec), shared
  # and static, and run.
  capi:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin, x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}
      - name: Package the C libraries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: crates/parsec-capi/package.sh "$RUNNER_TEMP/parsec" "$TARGET"
      - name: Build and run tests/capi.c against the package
        shell: bash
        run: |
          cmake -S crates/parsec-capi/tests -B "$RUNNER_TEMP/capi-test" -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/parsec" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/capi-test" --config Release
          ctest --test-dir "$RUNNER_TEMP/capi-test" -C Release --output-on-failure

  # The checked-in header against what cbindgen makes from the source, and
  # the C test, built through pkg-config, under AddressSanitizer (with
  # LeakSanitizer, on by default on Linux) and UndefinedBehaviorSanitizer.
  # Rust's allocations go through malloc, so a document or string the API
  # fails to free shows up as a leak.
  capi-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cbindgen@0.29.4
      - name: include/parsec.h matches the source
        run: |
          cbindgen --quiet --config crates/parsec-capi/cbindgen.toml --crate parsec-capi --output "$RUNNER_TEMP/parsec.h"
          diff -u crates/parsec-capi/include/parsec.h "$RUNNER_TEMP/parsec.h" || {
            echo "include/parsec.h is out of date: run the cbindgen command in crates/parsec-capi/cbindgen.toml" >&2
            exit 1
          }
      - name: The header compiles as C++ too
        run: echo '#include <parsec.h>' | c++ -x c++ -std=c++11 -Wall -Werror -fsyntax-only -I crates/parsec-capi/include -
      - run: crates/parsec-capi/package.sh "$RUNNER_TEMP/parsec"
      # For the html5lib-tests encoding cases tests/capi.c runs.
      - run: git submodule update --init crates/parsec/tests/html5lib-tests
      - name: tests/capi.c under ASan, LSan and UBSan
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/parsec/lib/pkgconfig
          LD_LIBRARY_PATH: ${{ runner.temp }}/parsec/lib
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          # shellcheck disable=SC2046 # pkg-config's flags are words
          clang -std=c99 -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer \
            -DHTML5LIB_ENCODING='"crates/parsec/tests/html5lib-tests/encoding"' \
            crates/parsec-capi/tests/capi.c $(pkg-config --cflags --libs parsec) -o "$RUNNER_TEMP/capi"
          "$RUNNER_TEMP/capi"
