name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request ends the run on its old commit. Runs on
# main all finish: each one tests a commit that landed.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The fuzz crates sit outside the workspace and build only in the
      # nightly fuzz run, so a manifest that cargo can't load fails there.
      - run: for m in crates/*/fuzz/Cargo.toml; do cargo metadata --no-deps --format-version 1 --manifest-path "$m" > /dev/null || exit 1; done
      # A prebuilt binary: the cargo-deny action builds a Docker image on
      # every run, and fails whenever Docker Hub does.
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-deny
      - run: cargo deny check licenses bans sources

  # Known vulnerabilities in the Rust dependencies, from the RustSec
  # database. Not a required check: a new advisory shouldn't block an
  # unrelated pull request, but it shows red until it's fixed.
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-deny
      - run: cargo deny check advisories

  # crates/parsec's source comes from Netweir's crates/netweir-html. This
  # fails if it no longer matches Netweir at the commit in NETWEIR_COMMIT,
  # which is what an edit made here instead of there looks like.
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A pull request can change NETWEIR_COMMIT, so only a full commit
      # hash is used: never a branch, tag or anything else git would read.
      - id: pin
        run: |
          commit=$(tr -d '[:space:]' < NETWEIR_COMMIT)
          if ! printf '%s' "$commit" | grep -Eqx '[0-9a-f]{40}'; then
            echo "NETWEIR_COMMIT must hold a full 40-character commit hash, not '$commit'" >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: netweir/netweir
          ref: ${{ steps.pin.outputs.commit }}
          path: netweir
          persist-credentials: false
      - run: scripts/sync-from-netweir.sh --check netweir
      - name: Every Rust file states its licence and copyright
        run: scripts/check-headers.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: cargo test --workspace
