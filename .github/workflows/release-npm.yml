name: release-npm

# The parsec-html package on npm, built when a v* tag is pushed. A manual
# run builds and tests it and publishes nothing, to try a release first.
#
# Publishing is npm's trusted publishing, with provenance, so no token is
# stored here. It stays off until the maintainer has added this workflow
# as the package's trusted publisher on npmjs.com, created the `release`
# environment, and set the repository variable NPM_PUBLISH to true.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: bindings/wasm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: wasm-pack
      - name: The tag is the package's version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p 'require("./npm/package.json").version')
          [ "v$version" = "$TAG" ] || { echo "npm/package.json says $version, the tag $TAG" >&2; exit 1; }
      - run: ./build.sh
      - run: mkdir -p node_modules && ln -s ../pkg node_modules/parsec-html
      - run: node --test tests/package.test.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: bindings/wasm/pkg
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'parsec-html/parsec' && vars.NPM_PUBLISH == 'true'
    needs: [build]
    runs-on: ubuntu-latest
    # Most of it is waiting for release.yml.
    timeout-minutes: 45
    environment:
      name: release
      url: https://www.npmjs.com/package/parsec-html
    permissions:
      # For trusted publishing and the provenance statement.
      id-token: write
      # To see release.yml's release.
      contents: read
    steps:
      # release.yml makes the release once the tag's signature checks out
      # and the crates have built twice the same; nothing goes to npm
      # for a tag that fails that.
      - name: Wait for release.yml's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 60); do
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && exit 0
            sleep 30
          done
          echo "no release for $GITHUB_REF_NAME after 30 minutes: did release.yml fail?" >&2
          exit 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: pkg
      # Trusted publishing needs npm 11.5 or later, which Node 24 has.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      # A version npm has already is left alone, so a failed run can be run
      # again.
      - name: Publish
        working-directory: pkg
        run: |
          version=$(node -p 'require("./package.json").version')
          if npm view "parsec-html@$version" version > /dev/null 2>&1; then
            echo "parsec-html $version is on npm already"
          else
            npm publish --provenance --access public
          fi
