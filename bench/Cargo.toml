[package]
name = "parsec-html-bench"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"
description = "Times Parsec against Lexbor's C, html5ever, Ada and cssparser on the same pages, URLs and stylesheets in one process."

# Its own workspace, so `cargo test --workspace` on every OS doesn't build
# Lexbor's C.
[workspace]

[[bin]]
name = "parsec-html-bench"
path = "src/main.rs"
test = false
bench = false

[dependencies]
cssparser = "0.38"
html5ever = "0.40"
markup5ever_rcdom = "0.40"
parsec-html-core = { path = "../crates/parsec" }
parsec-html-css = { path = "../crates/parsec-css" }
parsec-html-encoding = { path = "../crates/parsec-encoding" }
parsec-url = { path = "../crates/parsec-url" }
serde_json = "1"

[build-dependencies]
cc = "1"
cmake = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
