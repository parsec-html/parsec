[package]
name = "parsec-html-bench"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"
description = "Times Parsec against Lexbor's C, html5ever, Ada, cssparser, oxc and swc on the same pages, URLs, stylesheets and scripts in one process."

# Its own workspace, so `cargo test --workspace` on every OS doesn't build
# Lexbor's C.
[workspace]

[[bin]]
name = "parsec-html-bench"
path = "src/main.rs"
test = false
bench = false

[dependencies]
cssparser = "0.38"
html5ever = "0.40"
markup5ever_rcdom = "0.40"
parsec-html-core = { path = "../crates/parsec" }
parsec-html-css = { path = "../crates/parsec-css" }
parsec-html-encoding = { path = "../crates/parsec-encoding" }
parsec-url = { path = "../crates/parsec-url" }
parsec-xml = { path = "../crates/parsec-xml" }
quick-xml = "0.42"
roxmltree = "0.21"
parsec-js = { path = "../crates/parsec-js" }
# Pinned exactly: a new release of either is a new set of numbers.
oxc_allocator = "=0.157.0"
# `benchmarking` makes its lexer public, for `js-lex`.
oxc_parser = { version = "=0.157.0", features = ["benchmarking"] }
oxc_span = "=0.157.0"
swc_common = "=27.0.0"
swc_ecma_ast = "=30.0.0"
swc_ecma_parser = "=47.0.0"
serde_json = "1"

[build-dependencies]
cc = "1"
cmake = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
