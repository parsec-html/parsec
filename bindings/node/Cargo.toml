[package]
name = "parsec-web-node"
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/parsec-html/parsec"
description = "Parsec for Node.js, built for the machine: the same API as the WebAssembly package, with napi-rs."
publish = false

# Its own workspace, as bindings/wasm is: a Node-API addon only links
# inside Node, so the root's `cargo test --workspace` leaves it out.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "=3.16.2"
napi-derive = "=3.7.1"
parsec-web-core = { path = "../../crates/parsec" }
parsec-web-encoding = { path = "../../crates/parsec-encoding" }
parsec-xpath = { path = "../../crates/parsec-xpath" }
parsec-js = { path = "../../crates/parsec-js", optional = true }
parsec-xml = { path = "../../crates/parsec-xml", optional = true }

[features]
# parseJs, pageState and Document.pageState; parseXml, parseXmlBytes and
# the Xml classes. Both as in the WebAssembly build;
# `--no-default-features` builds the HTML parser alone.
default = ["js", "xml"]
js = ["dep:parsec-js"]
xml = ["dep:parsec-xml"]

[build-dependencies]
napi-build = "=2.6.0"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
