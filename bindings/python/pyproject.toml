[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "parsec-html"
description = "A fast, spec-following HTML parser with CSS selectors and an editable tree, with a selectolax-style API."
readme = "README.md"
license = "Apache-2.0"
# Copies of the repository's, which CI checks are the same: maturin takes
# them from beside this file, into the wheels and the sdist.
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
keywords = ["html", "parser", "html5", "css-selectors", "selectolax"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Rust",
    "Topic :: Text Processing :: Markup :: HTML",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/parsec-html/parsec"
Documentation = "https://github.com/parsec-html/parsec/wiki/Python"
Issues = "https://github.com/parsec-html/parsec/issues"

[tool.maturin]
module-name = "parsec_html"
